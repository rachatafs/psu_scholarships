{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PSU Phuket Scholarships{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=9.8">
</head>
<body>
    {% include 'partials/navbar.html' %}
    
    <main class="main-body-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}
    <script src="{% static 'js/main.js' %}?v=9.4"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll(".favorite-form, .detail-favorite-form").forEach(form => {
            form.addEventListener("submit", function(e) {
                e.preventDefault();
                const btn = form.querySelector("button");
                const icon = form.querySelector(".material-symbols-outlined");
                const textSpan = btn.querySelector("span:not(.material-symbols-outlined)");
                
                fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                        "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value
                    }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        if (data.is_favorited) {
                            icon.style.fontVariationSettings = "'FILL' 1";
                            icon.style.color = "var(--danger-color)";
                            if (textSpan && textSpan.innerText.includes("บันทึก")) {
                                textSpan.innerText = "ลบบันทึกทุนนี้";
                            }
                        } else {
                            icon.style.fontVariationSettings = "'FILL' 0";
                            icon.style.color = "var(--text-muted)";
                            if (textSpan && textSpan.innerText.includes("บันทึก")) {
                                textSpan.innerText = "บันทึกทุนนี้ไว้ดูภายหลัง";
                            }
                        }
                    }
                });
            });
        });
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
